# Standalone development service; Compose Up also builds the local Python image.
services:
  sma-mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile-SMAB
    image: sma-mqtt-bridge:dev
    pull_policy: build
    user: "${SMAB_UID:-10001}:${SMAB_GID:-10001}"
    env_file:
      - path: ${SMAB_ENV_FILE:-./smab.env}
        required: false
    volumes:
      - type: bind
        source: ${SMAB_DATA_DIR:-./data/sma-mqtt-bridge}
        target: /data/sma-mqtt-bridge/config
        read_only: true
      - type: volume
        source: data_smab_state
        target: /data/sma-mqtt-bridge/state
    networks:
      - app-nw
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  data_smab_state:

networks:
  app-nw:
    driver: bridge
