# Deployment template for the future runtime. No GHCR release exists yet.
# Bootstrap diagnostics: use docker-compose.dev.yml and an explicit CLI command.
services:
  sma-mqtt-bridge:
    image: ghcr.io/alaub81/sma-mqtt-bridge:${SMA_BRIDGE_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    volumes:
      - sma_bridge_state:/app/state
    # Enable the normal restart policy after runtime adapters are implemented.
    restart: "no"

volumes:
  sma_bridge_state:
