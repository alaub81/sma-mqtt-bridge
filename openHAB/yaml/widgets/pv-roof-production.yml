                          - component: oh-icon
                            config:
                              icon: =props.icon || 'f7:bolt_circle'
                              width: 12
                              height: 12
                              style:
                                display: block
                                flex-shrink: '0'
                                width: 12px
                                height: 12px
                                font-size: 12px
                                color: =props.iconColor || '#FFD60A'
                          - component: Label
                            config:
                              text: =props.title || 'PV nach Dachfläche'
                              style:
                                font-size: clamp(7.5px, 4.8cqw, 11px)
                                font-weight: '600'
                                line-height: 18px
                                white-space: nowrap
                                overflow: hidden
                                text-overflow: ellipsis
                                min-width: '0'
                          - component: Label
                            config:
                              text: '=props.demoMode === true ? ''Beispielwerte'' : '''''
                              style:
                                font-size: 11px
                                font-weight: '400'
                                margin-left: auto
                                color: var(--pv-muted)
                    - component: div
                      config:
                        class: smab-roof-scene
                      slots:
                        default:
                          - component: div
                            config:
                              style: {}
                              class: smab-roof-house
                            slots:
                              default:
