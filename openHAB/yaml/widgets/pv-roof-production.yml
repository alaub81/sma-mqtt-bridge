version: 1
widgets:
  pv_roof_production:
    tags:
      - PV
      - Energie
    props:
      parameterGroups:
        - name: display
          label: Anzeige
        - name: sources
          label: DC-Items und Verfügbarkeit
        - name: colors
          label: Farben
      parameters:
        - name: title
          label: Titel
          type: TEXT
          groupName: display
          default: PV nach Dachfläche
        - name: icon
          label: Titel-Icon
          type: TEXT
          groupName: display
          default: f7:bolt_circle
        - name: iconColor
          label: Titel-Icon-Farbe
          type: TEXT
          groupName: display
          default: '#FFD60A'
        - name: soLabel
          label: Beschriftung SO
          type: TEXT
          groupName: display
          default: SO
        - name: nwLabel
          label: Beschriftung NW
          type: TEXT
          groupName: display
          default: NW
        - name: swLabel
          label: Beschriftung SW
          type: TEXT
          groupName: display
          default: SW
        - name: showTitle
          label: Titel anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: showTotal
          label: DC-Summe anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: showGrid
          label: Modulraster anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: demoMode
          label: Beispielwerte verwenden
          type: BOOLEAN
          groupName: display
          default: false
          description: Nur zur Vorschau. Ohne Aktivierung werden ausschließlich ausgewählte Items verwendet.
        - name: soPowerItem
          label: SO · Hausdach SO · Leistung (W/kW)
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: DC-Messwert auswählen; kein Tagesertrag und keine AC-Leistung.
        - name: soVoltageItem
          label: SO · Hausdach SO · Spannung (V)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: soCurrentItem
          label: SO · Hausdach SO · Strom (A)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: nwPowerItem
          label: NW · Hausdach NW · Leistung (W/kW)
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: DC-Messwert auswählen; kein Tagesertrag und keine AC-Leistung.
        - name: nwVoltageItem
          label: NW · Hausdach NW · Spannung (V)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: nwCurrentItem
          label: NW · Hausdach NW · Strom (A)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: swPowerItem
          label: SW · Carport vorne · Leistung (W/kW)
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: DC-Messwert auswählen; kein Tagesertrag und keine AC-Leistung.
        - name: swVoltageItem
          label: SW · Carport vorne · Spannung (V)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: swCurrentItem
          label: SW · Carport vorne · Strom (A)
          type: TEXT
          groupName: sources
          context: item
          required: false
          description: Optional. Ohne gültigen Wert erscheint — in den Details.
        - name: roofStatusItem
          label: Dachwechselrichter · Quellenstatus
          type: TEXT
          groupName: sources
          context: item
          description: 'Optional: Status-Item mit ready/stale/error/init. Nur ready erlaubt Messwerte; ohne Auswahl
            erfolgt keine Quellenstatusprüfung.'
        - name: carportStatusItem
          label: Carport-Wechselrichter · Quellenstatus
          type: TEXT
          groupName: sources
          context: item
          description: 'Optional: Status-Item mit ready/stale/error/init. Nur ready erlaubt Messwerte; ohne Auswahl
            erfolgt keine Quellenstatusprüfung.'
        - name: pvColor
          label: PV-Akzentfarbe
          type: TEXT
          groupName: colors
          default: '#FFD60A'
        - name: pvIdleColor
          label: PV-Farbe bei 0 W
          type: TEXT
          groupName: colors
          default: '#0A84FF'
        - name: textColor
          label: Textfarbe
          type: TEXT
          groupName: colors
          default: var(--f7-text-color)
        - name: backgroundColor
          label: Hintergrund
          type: TEXT
          groupName: colors
          default: var(--f7-card-bg-color)
        - name: wallColor
          label: Hauswand
          type: TEXT
          groupName: colors
          default: rgba(128,128,136,0.20)
        - name: roofColor
          label: Dachflächen
          type: TEXT
          groupName: colors
          default: rgba(128,128,136,0.10)
        - name: windowColor
          label: Fenster
          type: TEXT
          groupName: colors
          default: var(--f7-page-bg-color)
    component: f7-card
    config:
      class: smab-pv-roofs oh-cell card-prevent-open
      expandable: true
      stylesheet: |-
        .smab-pv-roofs { box-sizing: border-box; container-type: inline-size; min-width: 0; }
        .smab-pv-roofs .card-content { padding: 0; }
        .smab-roof-scene { width: 100%; height: 0; padding-bottom: 64.516129%; position: relative; }
        .smab-roof-house { position: absolute; top: -12px; left: 50%; transform: translateX(-50%) scale(1.2); transform-origin: 50% 0; width: 156px; height: 88px; clip-path: inset(0 0 13%); pointer-events: none; }
        .smab-roof-stroke { position: absolute; pointer-events: none; }
        .smab-roof-shape { position: absolute; inset: 0; pointer-events: none; }
        .smab-roof-measure { position: absolute; width: 56px; min-width: 0; min-height: 40px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--pv-text); background: var(--pv-label); border: 1px solid var(--pv-line); border-radius: 7px; box-sizing: border-box; line-height: 1.2; text-decoration: none; }
        .smab-roof-measure:focus-visible { outline: 2px solid var(--pv-accent); outline-offset: 2px; }
        .smab-roof-total { border-top: 1px solid var(--pv-line); padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
        @container (max-width: 180px) { .smab-roof-total { flex-direction: column; align-items: flex-start; } }
        .smab-roof-details { margin-top: 12px; padding: 6px 8px 12px; box-sizing: border-box; min-width: 0; }
        .smab-roof-compact { position: relative; height: 120px; container-type: inline-size; }
        .smab-roof-header { position: absolute; top: 5px; left: 8px; right: 8px; font-size: clamp(7.5px, 4.8cqw, 11px) !important; line-height: 18px; height: 18px; gap: 4px !important; margin: 0 !important; }
        .smab-roof-scene { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 160px; height: 80px; padding: 0; }
        .smab-roof-measure { min-height: 26px; padding: 2px 0; gap: 0; }
        .smab-roof-measure > * { font-size: 9px !important; }
        .smab-roof-measure > *:first-child { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .smab-roof-measure > *:last-child { font-size: 10px !important; }
        .smab-roof-total { position: absolute; bottom: 3px; left: 8px; right: 8px; border: none; padding: 0; flex-direction: row; align-items: center; }
        .smab-roof-total > * { font-size: 10px !important; }
        .smab-roof-total > *:last-child { font-size: 12px !important; }
      style:
        min-width: '0'
        height: auto
        min-height: 120px
        max-height: none
        box-sizing: border-box
        container-type: inline-size
        padding: '0'
        overflow: hidden
        border: none
        color: var(--pv-text)
        background: =props.backgroundColor || 'var(--f7-card-bg-color)'
        --pv-accent: =props.pvColor || '#FFD60A'
        --pv-text: =props.textColor || 'var(--f7-text-color)'
        --pv-wall: =props.wallColor || 'rgba(128,128,136,0.20)'
        --pv-roof: =props.roofColor || 'rgba(128,128,136,0.10)'
        --pv-window: =props.windowColor || 'var(--f7-page-bg-color)'
        --pv-line: var(--f7-list-item-border-color, rgba(128,128,136,0.35))
        --pv-muted: 'var(--f7-list-item-after-text-color, #8e8e93)'
        --pv-panel: color-mix(in srgb, var(--pv-accent) 16%, transparent)
        --pv-grid: color-mix(in srgb, var(--pv-accent) 48%, transparent)
        --pv-label: color-mix(in srgb, var(--f7-card-bg-color) 60%, transparent)
    slots:
      default:
        - component: oh-context
          config:
            variables:
              pvArea: ''
            functions:
              power: >-
                =(name, demo, status) => props.demoMode === true ? demo : status && (!items[status] || items[status].state
                !== 'ready') ? Number.NaN : !name || !items[name] || !items[name].state || !/^\+?\d+(?:[.,]\d+)?(?:[eE][-+]?\d+)?\s*(?:W|kW|MW)?$/.test(items[name].state.trim())
                ? Number.NaN : Number.parseFloat(items[name].state.replace(',', '.')) * (/kW$/.test(items[name].state.trim())
                ? 1000 : /MW$/.test(items[name].state.trim()) ? 1000000 : 1)
              voltage: >-
                =(name, demo, status) => props.demoMode === true ? demo : status && (!items[status] || items[status].state
                !== 'ready') ? Number.NaN : !name || !items[name] || !items[name].state || !/^\+?\d+(?:[.,]\d+)?(?:[eE][-+]?\d+)?\s*V?$/.test(items[name].state.trim())
                ? Number.NaN : Number.parseFloat(items[name].state.replace(',', '.'))
              current: >-
                =(name, demo, status) => props.demoMode === true ? demo : status && (!items[status] || items[status].state
                !== 'ready') ? Number.NaN : !name || !items[name] || !items[name].state || !/^\+?\d+(?:[.,]\d+)?(?:[eE][-+]?\d+)?\s*A?$/.test(items[name].state.trim())
                ? Number.NaN : Number.parseFloat(items[name].state.replace(',', '.'))
              formatPower: >-
                =(watts) => !Number.isFinite(watts) || watts < 0 ? '—' : watts >= 1000 ? (watts / 1000).toFixed(2).replace('.',
                ',') + ' kW' : watts === 0 ? '0 W' : watts < 0.01 ? '<0,01 W' : watts < 10 ? watts.toFixed(2).replace(/\.?0+$/,
                '').replace('.', ',') + ' W' : Math.round(watts) + ' W'
              formatUnit: >-
                =(value, unit) => !Number.isFinite(value) || value < 0 ? '—' : value.toFixed(unit === 'A' ? 1 :
                0).replace('.', ',') + ' ' + unit
              panelColor: >-
                =(watts) => !Number.isFinite(watts) || watts < 0 ? 'var(--pv-muted)' : watts === 0 ? (props.pvIdleColor
                || '#0A84FF') : (props.pvColor || '#FFD60A')
          slots:
            default:
              - component: div
                config:
                  class: smab-roof-compact
                slots:
                  default:
                    - component: div
                      config:
                        class: smab-roof-header
                        visible: =props.showTitle !== false
