version: 1
widgets:
  pv_forecast:
    tags:
      - PV
      - Energie
      - Forecast
    props:
      parameterGroups:
        - name: display
          label: Anzeige
        - name: sources
          label: Energie-Items
        - name: traffic
          label: Ampelschwellen
        - name: colors
          label: Farben
        - name: actions
          label: Verlauf
      parameters:
        - name: title
          label: Titel
          type: TEXT
          groupName: display
          default: PV-Prognose
        - name: icon
          label: Titel-Icon
          type: TEXT
          groupName: display
          default: f7:bolt_circle
        - name: iconColor
          label: Titel-Icon-Farbe
          type: TEXT
          groupName: display
          default: '#FFD60A'
        - name: showTitle
          label: Titel anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: showRemaining
          label: Restprognose anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: showAverage
          label: Hausdurchschnitt anzeigen
          type: BOOLEAN
          groupName: display
          default: true
        - name: demoMode
          label: Beispielwerte verwenden
          type: BOOLEAN
          groupName: display
          default: false
        - name: decimals
          label: Nachkommastellen
          type: INTEGER
          groupName: display
          default: 1
          min: 0
          max: 3
        - name: averageDecimals
          label: Nachkommastellen Hausdurchschnitt
          type: INTEGER
          groupName: display
          default: 1
          min: 0
          max: 3
        - name: dayFontSize
          label: Schriftgröße Tagesnamen
          type: INTEGER
          groupName: display
          default: 10
          min: 7
          max: 16
        - name: locale
          label: Sprache für Wochentage
          type: TEXT
          groupName: display
          default: de
        - name: todayLabel
          label: Beschriftung heute
          type: TEXT
          groupName: display
          default: Heute
        - name: tomorrowLabel
          label: Beschriftung morgen
          type: TEXT
          groupName: display
          default: Morgen
        - name: day2Label
          label: Beschriftung übermorgen
          type: TEXT
          groupName: display
          default: ''
        - name: day3Label
          label: Beschriftung in drei Tagen
          type: TEXT
          groupName: display
          default: ''
        - name: todayItem
          label: Prognose heute
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: tomorrowItem
          label: Prognose morgen
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: day2Item
          label: Prognose übermorgen
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: day3Item
          label: Prognose in drei Tagen
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: remainingItem
          label: Heute verbleibend
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: averageItem
          label: Durchschnittlicher Haus-Tagesverbrauch
          type: TEXT
          groupName: sources
          context: item
          required: true
          description: Energie in kWh, Wh oder MWh; Zahlen ohne Einheit werden als kWh interpretiert.
        - name: trafficIconSize
          label: Ampel-Icon-Größe
          type: INTEGER
          groupName: traffic
          default: 20
          min: 8
          max: 32
        - name: greenPercent
          label: Grün ab Anteil am Hausdurchschnitt (%)
          type: DECIMAL
          groupName: traffic
          default: 110
          min: 0
        - name: orangePercent
          label: Gelb ab Anteil am Hausdurchschnitt (%)
          type: DECIMAL
          groupName: traffic
          default: 70
          min: 0
        - name: greenColor
          label: Grün
          type: TEXT
          groupName: colors
          default: '#34C759'
        - name: orangeColor
          label: Gelb
          type: TEXT
          groupName: colors
          default: '#FFD60A'
        - name: redColor
          label: Rot
          type: TEXT
          groupName: colors
          default: '#FF3B30'
        - name: unknownColor
          label: Unbekannt
          type: TEXT
          groupName: colors
          default: 'var(--f7-list-item-after-text-color, #8e8e93)'
        - name: textColor
          label: Text
          type: TEXT
          groupName: colors
          default: var(--f7-text-color)
        - name: backgroundColor
          label: Hintergrund
          type: TEXT
          groupName: colors
          default: var(--f7-card-bg-color)
        - name: forecastChartItems
          label: 'Prognoseverlauf: Items'
          type: TEXT
          groupName: actions
          context: item
          multiple: true
          description: Gemeinsame Leistungsprognosen für die Analyzer-Ansicht. Ohne Auswahl wird das jeweilige Energie-Item
            verwendet.
        - name: day3ChartItems
          label: 'Verlauf in drei Tagen: abweichende Items'
          type: TEXT
          groupName: actions
          context: item
          multiple: true
        - name: showRemainingTraffic
          label: Rest-Ampel anzeigen
          type: BOOLEAN
          groupName: traffic
          default: true
        - name: remainingReference
          label: Rest-Ampel Bezugswert
          type: TEXT
          groupName: traffic
          default: house
          options:
            - value: house
              label: Haus-Tagesdurchschnitt
            - value: today
              label: Heutige Gesamtprognose
          description: 'house: verbleibende Energie im Verhältnis zum Haus-Tagesdurchschnitt. today: Anteil der
            aktuellen Gesamtprognose, der noch verbleibt; kein gespeicherter Morgenwert.'
        - name: remainingGreenPercent
          label: 'Rest: Grün ab Anteil am Bezugswert (%)'
          type: DECIMAL
          groupName: traffic
          default: 50
          min: 0
        - name: remainingOrangePercent
          label: 'Rest: Gelb ab Anteil am Bezugswert (%)'
          type: DECIMAL
          groupName: traffic
          default: 20
          min: 0
        - name: remainingTrafficIconSize
          label: Rest-Ampel-Icon-Größe
          type: INTEGER
          groupName: traffic
          default: 9
          min: 8
          max: 16
        - name: trafficGlow
          label: Aktive Leuchten hervorheben
          type: BOOLEAN
          groupName: traffic
          default: true
        - name: trafficInactiveOpacity
          label: Helligkeit inaktiver Leuchten
          type: DECIMAL
          groupName: traffic
          default: 0.25
          min: 0
          max: 1
        - name: trafficHousingColor
          label: Ampelgehäuse
          type: TEXT
          groupName: colors
          default: color-mix(in srgb, var(--fc-muted) 55%, transparent)
    component: f7-card
    config:
      class: smab-pv-forecast oh-cell card-prevent-open
      expandable: true
      stylesheet: |-
        .smab-fc-summary { height: 120px; position: relative; container-type: inline-size; }
        .smab-fc-header { position: absolute; top: 5px; left: 8px; right: 8px; height: 18px; display: flex; align-items: center; gap: 4px; }
        .smab-fc-title { display: flex; align-items: center; gap: 4px; min-width: 0; }
        .smab-fc-days { position: absolute; top: 27px; bottom: 25px; left: 8px; right: 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
        .smab-fc-day { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; min-width: 0; color: inherit; text-decoration: none; }
        .smab-fc-day-title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; max-width: 100%; font-size: clamp(7px, 3.8cqw, 10px); color: var(--fc-muted); }
        .smab-fc-day-title > div:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .smab-fc-footer { position: absolute; bottom: 5px; left: 8px; right: 8px; display: flex; align-items: center; gap: 4px; font-size: clamp(7px, 3.2cqw, 10px); color: var(--fc-muted); }
        .smab-fc-footlink { display: flex; align-items: center; gap: 3px; color: inherit; white-space: nowrap; min-width: 0; text-decoration: none; }
        .smab-fc-details { padding: 0 8px 12px; font-size: 11px; container-type: inline-size; }
        .smab-fc-detail-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
        .smab-fc-traffic { display: flex; flex-direction: column; align-items: center; justify-content: space-between; flex-shrink: 0; box-sizing: border-box; width: calc(var(--fc-signal-size) * 0.4); height: var(--fc-signal-size); padding: calc(var(--fc-signal-size) * 0.08); border-radius: calc(var(--fc-signal-size) * 0.12); background: var(--fc-signal-housing); pointer-events: none; }
        .smab-fc-lamp { display: block; flex-shrink: 0; width: calc(var(--fc-signal-size) * 0.24); height: calc(var(--fc-signal-size) * 0.24); border-radius: 50%; opacity: var(--fc-signal-inactive); }
        .smab-fc-lamp-red { background: var(--fc-signal-red); color: var(--fc-signal-red); }
        .smab-fc-lamp-orange { background: var(--fc-signal-orange); color: var(--fc-signal-orange); }
        .smab-fc-lamp-green { background: var(--fc-signal-green); color: var(--fc-signal-green); }
        .smab-fc-traffic-red > .smab-fc-lamp-red, .smab-fc-traffic-orange > .smab-fc-lamp-orange, .smab-fc-traffic-green > .smab-fc-lamp-green { opacity: 1; filter: var(--fc-signal-active-filter); box-shadow: var(--fc-signal-glow); }
        .smab-fc-traffic-unknown > .smab-fc-lamp { background: var(--fc-signal-unknown); opacity: 0.35; }
      style:
        height: auto
        min-height: 120px
        max-height: none
        padding: '0'
        border: none
        overflow: hidden
        box-sizing: border-box
        color: =props.textColor || 'var(--f7-text-color)'
        background: =props.backgroundColor || 'var(--f7-card-bg-color)'
        --fc-muted: 'var(--f7-list-item-after-text-color, #8e8e93)'
        --fc-signal-green: =props.greenColor || '#34C759'
        --fc-signal-orange: =props.orangeColor || '#FFD60A'
        --fc-signal-red: =props.redColor || '#FF3B30'
        --fc-signal-unknown: '=props.unknownColor || ''var(--f7-list-item-after-text-color, #8e8e93)'''
        --fc-signal-inactive: >-
          =Number.isFinite(Number(props.trafficInactiveOpacity)) && Number(props.trafficInactiveOpacity) >= 0 &&
          Number(props.trafficInactiveOpacity) <= 1 ? Number(props.trafficInactiveOpacity) : 0.25
        --fc-signal-active-filter: '=props.trafficGlow === false ? ''none'' : ''brightness(1.2) saturate(1.1)'''
        --fc-signal-glow: '=props.trafficGlow === false ? ''none'' : ''0 0 2px currentColor'''
        --fc-signal-housing: =props.trafficHousingColor || 'color-mix(in srgb, var(--fc-muted) 55%, transparent)'
    slots:
      default:
        - component: oh-context
          config:
            variables:
              forecastDay: -1
            functions:
              energy: >-
                =(name, demo) => props.demoMode === true ? demo : !name || !items[name] || !items[name].state ||
                !/^\+?\d+(?:[.,]\d+)?(?:[eE][-+]?\d+)?\s*(?:kWh|Wh|MWh)?$/.test(items[name].state.trim()) ? Number.NaN
                : Number.parseFloat(items[name].state.replace(',', '.')) * (/MWh$/.test(items[name].state.trim())
                ? 1000 : /(?:^|\d\s*)Wh$/.test(items[name].state.trim()) ? 0.001 : 1)
              format: >-
                =(value) => !Number.isFinite(value) || value < 0 ? '—' : value.toFixed(Number.isInteger(Number(props.decimals))
                && Number(props.decimals) >= 0 && Number(props.decimals) <= 3 ? Number(props.decimals) : 1).replace('.',
                ',')
              percent: >-
                =(value, average) => !Number.isFinite(value) || value < 0 || !Number.isFinite(average) || average
                <= 0 ? '—' : Math.round(value / average * 100) + ' %'
              formatRemaining: >-
                =(value) => !Number.isFinite(value) || value < 0 ? '—' : value.toFixed(1).replace('.', ',')
              status: >-
                =(value, average) => !Number.isFinite(value) || value < 0 || !Number.isFinite(average) || average
                <= 0 || !Number.isFinite(Number(props.orangePercent === undefined ? 70 : props.orangePercent)) ||
                !Number.isFinite(Number(props.greenPercent === undefined ? 110 : props.greenPercent)) || Number(props.orangePercent
                === undefined ? 70 : props.orangePercent) < 0 || Number(props.greenPercent === undefined ? 110 :
                props.greenPercent) <= Number(props.orangePercent === undefined ? 70 : props.orangePercent) ? 'unknown'
                : value >= average * Number(props.greenPercent === undefined ? 110 : props.greenPercent) / 100 ?
                'green' : value >= average * Number(props.orangePercent === undefined ? 70 : props.orangePercent)
                / 100 ? 'orange' : 'red'
              statusText: >-
                =(status) => status === 'green' ? 'Grün' : status === 'orange' ? 'Gelb' : status === 'red' ? 'Rot'
                : 'Unbekannt'
              formatAverage: >-
                =(value) => !Number.isFinite(value) || value < 0 ? '—' : value.toFixed(Number.isInteger(Number(props.averageDecimals))
                && Number(props.averageDecimals) >= 0 && Number(props.averageDecimals) <= 3 ? Number(props.averageDecimals)
                : 1).replace('.', ',')
              remainingStatus: >-
                =(value, average) => props.remainingReference !== undefined && props.remainingReference !== 'house'
                && props.remainingReference !== 'today' ? 'unknown' : !Number.isFinite(value) || value < 0 || !Number.isFinite(average)
                || average <= 0 || !Number.isFinite(Number(props.remainingOrangePercent === undefined ? 20 : props.remainingOrangePercent))
                || !Number.isFinite(Number(props.remainingGreenPercent === undefined ? 50 : props.remainingGreenPercent))
                || Number(props.remainingOrangePercent === undefined ? 20 : props.remainingOrangePercent) < 0 ||
                Number(props.remainingGreenPercent === undefined ? 50 : props.remainingGreenPercent) <= Number(props.remainingOrangePercent
                === undefined ? 20 : props.remainingOrangePercent) ? 'unknown' : value >= average * Number(props.remainingGreenPercent
                === undefined ? 50 : props.remainingGreenPercent) / 100 ? 'green' : value >= average * Number(props.remainingOrangePercent
                === undefined ? 20 : props.remainingOrangePercent) / 100 ? 'orange' : 'red'
          slots:
            default:
              - component: div
                config:
                  class: smab-fc-summary
                slots:
                  default:
                    - component: div
                      config:
                        class: smab-fc-header
                      slots:
                        default:
                          - component: div
                            config:
                              class: smab-fc-title
                              visible: =props.showTitle !== false
                            slots:
                              default:
                                - component: oh-icon
                                  config:
                                    icon: =props.icon || 'f7:bolt_circle'
                                    width: 12
                                    height: 12
                                    style:
                                      color: =props.iconColor || '#FFD60A'
                                      width: 12px
                                      height: 12px
                                      font-size: 12px
                                      display: block
                                      flex-shrink: '0'
                                - component: Label
                                  config:
                                    text: =props.title || 'PV-Prognose'
                                    style:
                                      font-size: clamp(7.5px, 4.8cqw, 11px)
                                      font-weight: '600'
                                      line-height: 18px
                                      white-space: nowrap
                                      overflow: hidden
                                      text-overflow: ellipsis
                                      min-width: '0'
                          - component: Label
                            config:
                              text: '=props.demoMode === true ? ''Demo · kWh'' : ''kWh'''
                              style:
                                margin-left: auto
                                font-size: 9px
                                color: var(--fc-muted)
                                white-space: nowrap
                    - component: div
                      config:
                        class: smab-fc-days
                      slots:
                        default:
                          - component: oh-link
                            config:
                              class: smab-fc-day
                              action: variable
                              actionVariable: forecastDay
                              actionVariableValue: '=vars.forecastDay === 0 ? -1 : 0'
                              tooltip: >-
                                =(props.todayLabel || 'Heute') + ': ' + fn.format(fn.energy(props.todayItem, 19))
                                + ' kWh · ' + fn.statusText(fn.status(fn.energy(props.todayItem, 19), fn.energy(props.averageItem,
                                11.5)))
                            slots:
                              default:
                                - component: div
                                  config:
                                    class: smab-fc-day-title
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: >-
                                            ='smab-fc-traffic smab-fc-traffic-' + fn.status(fn.energy(props.todayItem,
                                            19), fn.energy(props.averageItem, 11.5))
                                          style:
                                            --fc-signal-size: '=(props.trafficIconSize >= 8 && props.trafficIconSize
                                              <= 32 ? props.trafficIconSize : 20) + ''px'''
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-red
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-orange
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-green
                                      - component: Label
                                        config:
                                          text: =props.todayLabel || 'Heute'
                                          style:
                                            font-size: '=(props.dayFontSize >= 7 && props.dayFontSize <= 16 ? props.dayFontSize
                                              : 10) + ''px'''
                                - component: Label
                                  config:
                                    text: =fn.format(fn.energy(props.todayItem, 19))
                                    style:
                                      font-size: clamp(12px, 7cqw, 20px)
                                      font-weight: '600'
                                      font-variant-numeric: tabular-nums
                                      white-space: nowrap
                          - component: oh-link
                            config:
                              class: smab-fc-day
                              action: variable
                              actionVariable: forecastDay
                              actionVariableValue: '=vars.forecastDay === 1 ? -1 : 1'
                              tooltip: >-
                                =(props.tomorrowLabel || 'Morgen') + ': ' + fn.format(fn.energy(props.tomorrowItem,
                                19)) + ' kWh · ' + fn.statusText(fn.status(fn.energy(props.tomorrowItem, 19), fn.energy(props.averageItem,
                                11.5)))
                            slots:
                              default:
                                - component: div
                                  config:
                                    class: smab-fc-day-title
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: >-
                                            ='smab-fc-traffic smab-fc-traffic-' + fn.status(fn.energy(props.tomorrowItem,
                                            19), fn.energy(props.averageItem, 11.5))
                                          style:
                                            --fc-signal-size: '=(props.trafficIconSize >= 8 && props.trafficIconSize
                                              <= 32 ? props.trafficIconSize : 20) + ''px'''
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-red
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-orange
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-green
                                      - component: Label
                                        config:
                                          text: =props.tomorrowLabel || 'Morgen'
                                          style:
                                            font-size: '=(props.dayFontSize >= 7 && props.dayFontSize <= 16 ? props.dayFontSize
                                              : 10) + ''px'''
                                - component: Label
                                  config:
                                    text: =fn.format(fn.energy(props.tomorrowItem, 19))
                                    style:
                                      font-size: clamp(12px, 7cqw, 20px)
                                      font-weight: '600'
                                      font-variant-numeric: tabular-nums
                                      white-space: nowrap
                          - component: oh-link
                            config:
                              class: smab-fc-day
                              action: variable
                              actionVariable: forecastDay
                              actionVariableValue: '=vars.forecastDay === 2 ? -1 : 2'
                              tooltip: >-
                                =(props.day2Label || dayjs().add(2, 'day').locale(props.locale || 'de').format('dd'))
                                + ': ' + fn.format(fn.energy(props.day2Item, 11)) + ' kWh · ' + fn.statusText(fn.status(fn.energy(props.day2Item,
                                11), fn.energy(props.averageItem, 11.5)))
                            slots:
                              default:
                                - component: div
                                  config:
                                    class: smab-fc-day-title
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: >-
                                            ='smab-fc-traffic smab-fc-traffic-' + fn.status(fn.energy(props.day2Item,
                                            11), fn.energy(props.averageItem, 11.5))
                                          style:
                                            --fc-signal-size: '=(props.trafficIconSize >= 8 && props.trafficIconSize
                                              <= 32 ? props.trafficIconSize : 20) + ''px'''
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-red
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-orange
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-green
                                      - component: Label
                                        config:
                                          text: =props.day2Label || dayjs().add(2, 'day').locale(props.locale ||
                                            'de').format('dd')
                                          style:
                                            font-size: '=(props.dayFontSize >= 7 && props.dayFontSize <= 16 ? props.dayFontSize
                                              : 10) + ''px'''
                                - component: Label
                                  config:
                                    text: =fn.format(fn.energy(props.day2Item, 11))
                                    style:
                                      font-size: clamp(12px, 7cqw, 20px)
                                      font-weight: '600'
                                      font-variant-numeric: tabular-nums
                                      white-space: nowrap
                          - component: oh-link
                            config:
                              class: smab-fc-day
                              action: variable
                              actionVariable: forecastDay
                              actionVariableValue: '=vars.forecastDay === 3 ? -1 : 3'
                              tooltip: >-
                                =(props.day3Label || dayjs().add(3, 'day').locale(props.locale || 'de').format('dd'))
                                + ': ' + fn.format(fn.energy(props.day3Item, 19)) + ' kWh · ' + fn.statusText(fn.status(fn.energy(props.day3Item,
                                19), fn.energy(props.averageItem, 11.5)))
                            slots:
                              default:
                                - component: div
                                  config:
                                    class: smab-fc-day-title
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: >-
                                            ='smab-fc-traffic smab-fc-traffic-' + fn.status(fn.energy(props.day3Item,
                                            19), fn.energy(props.averageItem, 11.5))
                                          style:
                                            --fc-signal-size: '=(props.trafficIconSize >= 8 && props.trafficIconSize
                                              <= 32 ? props.trafficIconSize : 20) + ''px'''
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-red
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-orange
                                            - component: div
                                              config:
                                                class: smab-fc-lamp smab-fc-lamp-green
                                      - component: Label
                                        config:
                                          text: =props.day3Label || dayjs().add(3, 'day').locale(props.locale ||
                                            'de').format('dd')
                                          style:
                                            font-size: '=(props.dayFontSize >= 7 && props.dayFontSize <= 16 ? props.dayFontSize
                                              : 10) + ''px'''
                                - component: Label
                                  config:
                                    text: =fn.format(fn.energy(props.day3Item, 19))
                                    style:
                                      font-size: clamp(12px, 7cqw, 20px)
                                      font-weight: '600'
                                      font-variant-numeric: tabular-nums
                                      white-space: nowrap
                    - component: div
                      config:
                        class: smab-fc-footer
                      slots:
                        default:
                          - component: oh-link
                            config:
                              visible: =props.showRemaining !== false
