version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: "/ressources"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # aiohttp 3.14 requires multidict <7; reconsider when aiohttp supports v7.
    ignore:
      - dependency-name: multidict
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lint-tools:
        patterns: ["*"]
