name: Python CI (lint, tests, arm64 build)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - name: Install pinned linters
        run: |
          python -m venv .lint-venv
          .lint-venv/bin/python -m pip install --requirement tests/requirements-lint.txt
          .lint-venv/bin/python tests/install_lint_tools.py
      - name: Run all repository linters
        run: ./tests/linter-check.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - name: Install runtime libraries
        run: python -m pip install --requirement ressources/requirements.txt
      - name: Run offline Python regressions
        run: ./tests/test-check.sh
      - name: Validate both Compose templates with public settings
        run: python tests/compose_check.py

  build_and_scan:
    runs-on: ubuntu-24.04
    needs: [lint, tests]
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Python image without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-SMAB
          platforms: linux/${{ matrix.platform }}
          load: true
          push: false
          tags: sma-mqtt-bridge:ci-${{ matrix.platform }}
      - name: Container smoke checks and offline tests
        run: |
          docker run --rm sma-mqtt-bridge:ci-${{ matrix.platform }} --version
          docker run --rm sma-mqtt-bridge:ci-${{ matrix.platform }} --check-config
          docker run --rm --entrypoint python -v "$PWD/tests:/app/tests:ro" -v "$PWD/smab.example.env:/app/smab.example.env:ro" -v "$PWD/config.example.json:/app/config.example.json:ro" -v "$PWD/reference/inverter-things-inventory.json:/app/reference/inverter-things-inventory.json:ro" sma-mqtt-bridge:ci-${{ matrix.platform }} tests/run_tests.py
      - name: Trivy image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sma-mqtt-bridge:ci-${{ matrix.platform }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
