name: Python CI (lint, tests, amd64/arm64 builds)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'
      - name: Install pinned linters
        run: |
          python -m venv .lint-venv
          .lint-venv/bin/python -m pip install --requirement tests/requirements-lint.txt
          .lint-venv/bin/python tests/install_lint_tools.py
      - name: Run all repository linters
        run: ./tests/linter-check.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'
      - name: Install runtime libraries
        run: python -m pip install --requirement ressources/requirements.txt
      - name: Run offline Python regressions
        run: ./tests/test-check.sh
      - name: Validate both Compose templates with public settings
        run: python tests/compose_check.py

  build_and_scan:
    runs-on: ubuntu-24.04
    needs: [lint, tests]
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'
      - name: Resolve checkout version
        id: version
        run: |
          smab_build_version=$(PYTHONPATH=ressources python3 -c 'from sma_mqtt_bridge import __version__; print(__version__)')
          echo "value=$smab_build_version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Python image without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-SMAB
          build-args: SMAB_BUILD_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/${{ matrix.platform }}
          load: true
          push: false
          tags: sma-mqtt-bridge:ci-${{ matrix.platform }}
      - name: Container smoke checks and offline tests
        env:
          SMAB_EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(docker run --rm sma-mqtt-bridge:ci-${{ matrix.platform }} --version)" = "sma-mqtt-bridge $SMAB_EXPECTED_VERSION"
          docker run --rm sma-mqtt-bridge:ci-${{ matrix.platform }} --check-config
          docker run --rm --entrypoint python sma-mqtt-bridge:ci-${{ matrix.platform }} -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("pip", "ensurepip")), "Build-only package installers remain in image"'
          docker run --rm --entrypoint python -v "$PWD/tests:/app/tests:ro" -v "$PWD/tools:/app/tools:ro" -v "$PWD/docs/topic-catalog.csv:/app/docs/topic-catalog.csv:ro" -v "$PWD/docs/influx2-item-migration-2026-10-15.csv:/app/docs/influx2-item-migration-2026-10-15.csv:ro" -v "$PWD/smab.example.env:/app/smab.example.env:ro" -v "$PWD/docs/config.example.json:/app/docs/config.example.json:ro" -v "$PWD/reference/inverter-things-inventory.json:/app/reference/inverter-things-inventory.json:ro" sma-mqtt-bridge:ci-${{ matrix.platform }} tests/run_tests.py
      - name: Trivy image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sma-mqtt-bridge:ci-${{ matrix.platform }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
