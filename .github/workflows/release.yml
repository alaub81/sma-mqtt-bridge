name: Release (build & push)

# Stable tag pushes publish validated GHCR images; no scheduled releases.
'on':
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: [validation]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      security-events: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
      is_latest: ${{ steps.release_tag.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this is the newest stable release
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable vMAJOR.MINOR.PATCH tags are supported: $GITHUB_REF_NAME" >&2
            exit 1
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          tags="$(git tag --list 'v*.*.*' --sort=-v:refname)"
          latest_tag="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p' || true)"
          if [ "$GITHUB_REF_NAME" = "$latest_tag" ]; then
            echo 'is_latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_latest=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Newest stable tag: ${latest_tag:-none}; current tag: $GITHUB_REF_NAME"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          check-latest: true
      - name: Verify Python runtime before release
        run: |
          python -m pip install --requirement ressources/requirements.txt
          ./tests/test-check.sh

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (semver without v; aliases only for newest release)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sma-mqtt-bridge
          flavor: |
            latest=false
          tags: |
            # Convert v1.2.3 to 1.2.3
            type=semver,pattern={{version}},prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=,enable=${{ steps.release_tag.outputs.is_latest }}
            type=semver,pattern={{major}},prefix=,enable=${{ steps.release_tag.outputs.is_latest }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=SMA MQTT Bridge
            org.opencontainers.image.description=Local SMA solar, battery and EV charger monitoring via Homie 4 MQTT for openHAB and smart homes.
            org.opencontainers.image.licenses=MIT

      # Build for amd64 before scanning
      - name: Pre-build (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-SMAB
          build-args: SMAB_BUILD_VERSION=${{ steps.release_tag.outputs.version }}
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image version matches release tag
        env:
          SMAB_EXPECTED_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          test "$(docker run --rm scan:${{ github.sha }} --version)" = "sma-mqtt-bridge $SMAB_EXPECTED_VERSION"

      - name: Trivy Image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          format: sarif
          output: trivy-release.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Trivy Image (enforce severity)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload SARIF
        if: >-
          ${{ always() && github.event.repository.private == false &&
              hashFiles('trivy-release.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release.sarif
          category: trivy-image-release

      - name: Build & Push (multi-arch)
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-SMAB
          build-args: SMAB_BUILD_VERSION=${{ steps.release_tag.outputs.version }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release_notes:
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          check-latest: true
      - name: Generate user-facing release notes including direct commits
        env:
          SMAB_RELEASE_TAG: ${{ github.ref_name }}
          SMAB_RELEASE_REPOSITORY: ${{ github.repository }}
          SMAB_RELEASE_IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
        run: |
          python tools/create_release_notes.py --tag "$SMAB_RELEASE_TAG" \
            --repository "$SMAB_RELEASE_REPOSITORY" \
            --image-digest "$SMAB_RELEASE_IMAGE_DIGEST" \
            --output "$RUNNER_TEMP/smab-release-notes.md"
      - name: Publish release without replacing existing edited notes
        env:
          GH_TOKEN: ${{ github.token }}
          SMAB_RELEASE_TAG: ${{ github.ref_name }}
          SMAB_RELEASE_IS_LATEST: ${{ needs.release.outputs.is_latest }}
        run: |
          if gh release view "$SMAB_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release preserved; no notes were overwritten."
          else
            gh release create "$SMAB_RELEASE_TAG" --verify-tag \
              --title "SMA MQTT Bridge $SMAB_RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/smab-release-notes.md" \
              --latest="$SMAB_RELEASE_IS_LATEST"
          fi
